  <!-- the bottle, its ridged cap and its label -->
  <rect x="70" y="86" width="60" height="84" rx="10" fill="#FFFFFF" stroke="#0F1115" stroke-width="4"/>
  <rect x="66" y="64" width="68" height="26" rx="5" fill="#D5D8DD" stroke="#0F1115" stroke-width="4"/>
  <line fill="none" x1="79" y1="70" x2="79" y2="84" stroke="#0F1115" stroke-width="2"/>
  <line fill="none" x1="90" y1="70" x2="90" y2="84" stroke="#0F1115" stroke-width="2"/>
  <line fill="none" x1="100" y1="70" x2="100" y2="84" stroke="#0F1115" stroke-width="2"/>
  <line fill="none" x1="110" y1="70" x2="110" y2="84" stroke="#0F1115" stroke-width="2"/>
  <line fill="none" x1="121" y1="70" x2="121" y2="84" stroke="#0F1115" stroke-width="2"/>
  <rect x="76" y="106" width="48" height="46" rx="4" fill="#C6F432" stroke="#0F1115" stroke-width="3"/>
  <circle cx="96" cy="131" r="13" fill="#0F1115"/>
  <circle cx="103" cy="125" r="12" fill="#C6F432"/>
  <circle cx="114" cy="141" r="2.5" fill="#0F1115"/>
  <circle cx="117" cy="115" r="2" fill="#0F1115"/>
  <!-- the spilled pills: a capsule and a scored tablet -->
  <rect x="139" y="153" width="34" height="14" rx="7" fill="#FFFFFF" stroke="#0F1115" stroke-width="3" transform="rotate(-25 156 160)"/>
  <path d="M156 153h10a7 7 0 0 1 0 14h-10z" fill="#C6F432" stroke="#0F1115" stroke-width="3" transform="rotate(-25 156 160)"/>
  <circle cx="46" cy="161" r="11" fill="#FFFFFF" stroke="#0F1115" stroke-width="3"/>
  <line fill="none" x1="39" y1="157" x2="53" y2="165" stroke="#0F1115" stroke-width="2"/>
  <!-- the wide-open eye -->
  <path d="M122 44Q152 18 182 44Q152 70 122 44z" fill="#FFFFFF" stroke="#0F1115" stroke-width="4"/>
  <circle cx="152" cy="44" r="11" fill="#D5D8DD" stroke="#0F1115" stroke-width="3"/>
  <circle cx="152" cy="44" r="5" fill="#0F1115"/>
  <circle cx="155" cy="41" r="2" fill="#FFFFFF"/>
  <line fill="none" x1="152" y1="31" x2="152" y2="21" stroke="#0F1115" stroke-width="3"/>
  <line fill="none" x1="138" y1="34" x2="133" y2="26" stroke="#0F1115" stroke-width="3"/>
  <line fill="none" x1="166" y1="34" x2="171" y2="26" stroke="#0F1115" stroke-width="3"/>
  <!-- the speech bubble -->
  <path d="M26 24h40a10 10 0 0 1 10 10v12a10 10 0 0 1-10 10h-24l-10 10v-10h-6a10 10 0 0 1-10-10v-12a10 10 0 0 1 10-10z" fill="#0F1115"/>
  <circle cx="36" cy="40" r="3.2" fill="#FFFFFF"/>
  <circle cx="46" cy="40" r="3.2" fill="#FFFFFF"/>
  <circle cx="56" cy="40" r="3.2" fill="#FFFFFF"/>
</svg>
