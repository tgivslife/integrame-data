<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" stroke-linecap="round" stroke-linejoin="round">
  <!-- Somnifere: a bottle of sleeping pills with a lime label and a crescent moon, two spilled pills, a wide-open eye, and the speech bubble of a cu-poantă puzzle -->
