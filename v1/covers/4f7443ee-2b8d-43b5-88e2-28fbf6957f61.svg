<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" stroke-linecap="round" stroke-linejoin="round">
  <!-- Copilul care plânge: a wailing baby with lime tears, the song his father threatens him with, and the speech bubble of a cu-poantă puzzle -->
