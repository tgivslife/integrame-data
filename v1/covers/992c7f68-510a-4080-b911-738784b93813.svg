  <line x1="-1" y1="-5" x2="16" y2="-5" fill="none" stroke="#0F1115" stroke-width="3" transform="translate(150 62) rotate(-20)"/>
  <line x1="-1" y1="5" x2="10" y2="5" fill="none" stroke="#0F1115" stroke-width="3" transform="translate(150 62) rotate(-20)"/>
