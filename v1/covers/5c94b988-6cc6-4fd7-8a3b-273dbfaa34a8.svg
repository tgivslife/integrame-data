<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" stroke-linecap="round" stroke-linejoin="round">
  <!-- Creditul: the shop's notebook of debts, "trece-mă pe caiet", with its pencil and a few coins, and the speech bubble of a cu-poantă puzzle -->
  <ellipse cx="106" cy="178" rx="74" ry="5" fill="#0F1115" opacity="0.12"/>
  <!-- the notebook's page, its rings, its ruled lines -->
  <rect x="82" y="46" width="84" height="124" rx="6" fill="#FFFFFF" stroke="#0F1115" stroke-width="4" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="90" y1="74" x2="158" y2="74" fill="none" stroke="#D5D8DD" stroke-width="2" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="90" y1="90" x2="158" y2="90" fill="none" stroke="#D5D8DD" stroke-width="2" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="90" y1="106" x2="158" y2="106" fill="none" stroke="#D5D8DD" stroke-width="2" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="90" y1="122" x2="158" y2="122" fill="none" stroke="#D5D8DD" stroke-width="2" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="90" y1="138" x2="158" y2="138" fill="none" stroke="#D5D8DD" stroke-width="2" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="90" y1="154" x2="158" y2="154" fill="none" stroke="#D5D8DD" stroke-width="2" transform="translate(4 0) rotate(-5 124 108)"/>
  <rect x="91" y="38" width="6" height="16" rx="3" fill="#FFFFFF" stroke="#0F1115" stroke-width="2.5" transform="translate(4 0) rotate(-5 124 108)"/>
  <rect x="105" y="38" width="6" height="16" rx="3" fill="#FFFFFF" stroke="#0F1115" stroke-width="2.5" transform="translate(4 0) rotate(-5 124 108)"/>
  <rect x="119" y="38" width="6" height="16" rx="3" fill="#FFFFFF" stroke="#0F1115" stroke-width="2.5" transform="translate(4 0) rotate(-5 124 108)"/>
  <rect x="133" y="38" width="6" height="16" rx="3" fill="#FFFFFF" stroke="#0F1115" stroke-width="2.5" transform="translate(4 0) rotate(-5 124 108)"/>
  <rect x="147" y="38" width="6" height="16" rx="3" fill="#FFFFFF" stroke="#0F1115" stroke-width="2.5" transform="translate(4 0) rotate(-5 124 108)"/>
  <!-- the debts: a name and a sum on each line, the total underlined -->
