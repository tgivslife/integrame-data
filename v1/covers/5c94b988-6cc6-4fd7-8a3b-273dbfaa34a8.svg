  <rect x="-46" y="-7" width="12" height="14" rx="3" fill="#D5D8DD" stroke="#0F1115" stroke-width="3" transform="translate(132 158) rotate(165)"/>
  <rect x="-36" y="-7" width="66" height="14" fill="#C6F432" stroke="#0F1115" stroke-width="3" transform="translate(132 158) rotate(165)"/>
