  <line x1="64" y1="148" x2="64" y2="166" fill="none" stroke="#0F1115" stroke-width="3"/>
  <path d="M28 154a18 6 0 0 0 36 0M28 160a18 6 0 0 0 36 0" fill="none" stroke="#0F1115" stroke-width="2.5"/>
  <ellipse cx="46" cy="148" rx="18" ry="6" fill="#FFFFFF" stroke="#0F1115" stroke-width="3"/>
  <!-- the speech bubble -->
  <path d="M26 24h40a10 10 0 0 1 10 10v12a10 10 0 0 1-10 10h-24l-10 10v-10h-6a10 10 0 0 1-10-10v-12a10 10 0 0 1 10-10z" fill="#0F1115"/>
  <circle cx="36" cy="40" r="3.2" fill="#FFFFFF"/>
  <circle cx="46" cy="40" r="3.2" fill="#FFFFFF"/>
  <circle cx="56" cy="40" r="3.2" fill="#FFFFFF"/>
</svg>
