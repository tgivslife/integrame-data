  <path d="M92 86q3-6 6 0t6 0t6 0t6 0" fill="none" stroke="#0F1115" stroke-width="2.5" transform="translate(4 0) rotate(-5 124 108)"/>
  <path d="M92 102q3-6 6 0t6 0t6 0t6 0t6 0t6 0" fill="none" stroke="#0F1115" stroke-width="2.5" transform="translate(4 0) rotate(-5 124 108)"/>
  <path d="M92 118q3-6 6 0t6 0t6 0" fill="none" stroke="#0F1115" stroke-width="2.5" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="140" y1="70" x2="154" y2="70" fill="none" stroke="#0F1115" stroke-width="3" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="144" y1="86" x2="154" y2="86" fill="none" stroke="#0F1115" stroke-width="3" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="138" y1="102" x2="154" y2="102" fill="none" stroke="#0F1115" stroke-width="3" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="142" y1="118" x2="154" y2="118" fill="none" stroke="#0F1115" stroke-width="3" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="132" y1="128" x2="158" y2="128" fill="none" stroke="#0F1115" stroke-width="3" transform="translate(4 0) rotate(-5 124 108)"/>
  <line x1="136" y1="144" x2="156" y2="144" fill="none" stroke="#0F1115" stroke-width="5" transform="translate(4 0) rotate(-5 124 108)"/>
