<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ringul de box: a pair of boxing gloves in front of a ring's corner post and ropes, and the speech bubble of a cu-poantă puzzle -->
  <ellipse cx="104" cy="173" rx="72" ry="5" fill="#0F1115" opacity="0.12"/>
  <!-- the corner post and its three ropes -->
  <line x1="22" y1="86" x2="166" y2="86" fill="none" stroke="#0F1115" stroke-width="4"/>
  <line x1="22" y1="108" x2="166" y2="108" fill="none" stroke="#0F1115" stroke-width="4"/>
  <line x1="22" y1="130" x2="166" y2="130" fill="none" stroke="#0F1115" stroke-width="4"/>
  <rect x="166" y="44" width="12" height="128" rx="3" fill="#D5D8DD" stroke="#0F1115" stroke-width="3"/>
  <!-- the left glove, lime: its fist, its thumb, its cuff and the cuff's band -->
  <path d="M40 136C32 112 32 84 48 70C64 56 92 60 96 84C100 106 94 124 88 136Z" fill="#C6F432" stroke="#0F1115" stroke-width="4"/>
  <path d="M86 126C100 122 104 104 96 98C90 94 84 102 84 112" fill="#C6F432" stroke="#0F1115" stroke-width="3"/>
  <rect x="42" y="134" width="44" height="34" rx="5" fill="#FFFFFF" stroke="#0F1115" stroke-width="4"/>
  <rect x="42" y="134" width="44" height="10" fill="#D5D8DD" stroke="#0F1115" stroke-width="3"/>
  <!-- the right glove, white, mirrored -->
  <path d="M40 136C32 112 32 84 48 70C64 56 92 60 96 84C100 106 94 124 88 136Z" fill="#FFFFFF" stroke="#0F1115" stroke-width="4" transform="translate(200 -6) scale(-1 1)"/>
  <path d="M86 126C100 122 104 104 96 98C90 94 84 102 84 112" fill="#FFFFFF" stroke="#0F1115" stroke-width="3" transform="translate(200 -6) scale(-1 1)"/>
  <rect x="42" y="134" width="44" height="34" rx="5" fill="#FFFFFF" stroke="#0F1115" stroke-width="4" transform="translate(200 -6) scale(-1 1)"/>
  <rect x="42" y="134" width="44" height="10" fill="#C6F432" stroke="#0F1115" stroke-width="3" transform="translate(200 -6) scale(-1 1)"/>
  <!-- the speech bubble -->
  <path d="M26 24h40a10 10 0 0 1 10 10v12a10 10 0 0 1-10 10h-24l-10 10v-10h-6a10 10 0 0 1-10-10v-12a10 10 0 0 1 10-10z" fill="#0F1115"/>
  <circle cx="36" cy="40" r="3.2" fill="#FFFFFF"/>
  <circle cx="46" cy="40" r="3.2" fill="#FFFFFF"/>
  <circle cx="56" cy="40" r="3.2" fill="#FFFFFF"/>
</svg>
