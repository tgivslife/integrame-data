<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" stroke-linecap="round" stroke-linejoin="round">
  <!-- Caloriile: a frying pan on the flame, its food burnt to a crisp and smoking, with the speech bubble of a cu-poantă puzzle -->
  <ellipse cx="100" cy="178" rx="70" ry="5" fill="#0F1115" opacity="0.12"/>
  <!-- the burner and its flames, peeking out under the pan -->
  <ellipse cx="98" cy="168" rx="46" ry="7" fill="#D5D8DD" stroke="#0F1115" stroke-width="3"/>
  <path d="M56 166c-7-5-6-14 1-22c1 7 8 9 7 16c0 4-4 6-8 6z" fill="#C6F432" stroke="#0F1115" stroke-width="3"/>
  <path d="M76 166c-7-5-6-15 2-24c1 8 9 10 7 17c-1 4-5 7-9 7z" fill="#C6F432" stroke="#0F1115" stroke-width="3"/>
  <path d="M120 166c-7-5-6-15 2-24c1 8 9 10 7 17c-1 4-5 7-9 7z" fill="#C6F432" stroke="#0F1115" stroke-width="3"/>
  <path d="M140 166c-7-5-6-14 1-22c1 7 8 9 7 16c0 4-4 6-8 6z" fill="#C6F432" stroke="#0F1115" stroke-width="3"/>
  <!-- the pan: its handle, its body, its rim, its bottom -->
  <rect x="0" y="-6" width="32" height="12" rx="6" fill="#0F1115" stroke="#0F1115" stroke-width="3" transform="translate(148 128) rotate(-12)"/>
  <path d="M44 124C44 140 68 152 98 152C128 152 152 140 152 124Z" fill="#FFFFFF" stroke="#0F1115" stroke-width="4"/>
  <ellipse cx="98" cy="124" rx="54" ry="20" fill="#FFFFFF" stroke="#0F1115" stroke-width="4"/>
  <ellipse cx="98" cy="127" rx="44" ry="14" fill="#D5D8DD"/>
  <!-- the food, charred black, a few cracks in its crust -->
  <path d="M76 126c1-8 15-11 24-9c10-4 22 0 20 8c-2 8-14 11-24 10c-11 2-21-2-20-9z" fill="#0F1115" stroke="#0F1115" stroke-width="3"/>
  <path d="M86 124l7 3M103 121l6 4M108 130l7-2" fill="none" stroke="#D5D8DD" stroke-width="2"/>
  <!-- the smoke rising from it -->
  <path d="M84 110c-8-8 6-14-2-24c-7-9 5-14-1-22" fill="none" stroke="#0F1115" stroke-width="3"/>
  <path d="M100 106c-8-10 8-16 0-28c-7-10 6-16 0-26" fill="none" stroke="#0F1115" stroke-width="3"/>
  <path d="M116 110c-7-8 6-14-1-23c-6-8 5-13 0-20" fill="none" stroke="#0F1115" stroke-width="3"/>
  <!-- the speech bubble -->
  <path d="M26 24h40a10 10 0 0 1 10 10v12a10 10 0 0 1-10 10h-24l-10 10v-10h-6a10 10 0 0 1-10-10v-12a10 10 0 0 1 10-10z" fill="#0F1115"/>
  <circle cx="36" cy="40" r="3.2" fill="#FFFFFF"/>
  <circle cx="46" cy="40" r="3.2" fill="#FFFFFF"/>
  <circle cx="56" cy="40" r="3.2" fill="#FFFFFF"/>
</svg>
