<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" stroke-linecap="round" stroke-linejoin="round">
  <!-- Soacra și ginerele: the son-in-law's house, its door shut, ivy climbing a corner, with the speech bubble of a cu-poantă puzzle -->
  <ellipse cx="115" cy="174" rx="68" ry="5" fill="#0F1115" opacity="0.12"/>
  <!-- the chimney, behind the roof -->
  <rect x="136" y="54" width="14" height="30" fill="#FFFFFF" stroke="#0F1115" stroke-width="3"/>
  <!-- the walls and the roof -->
  <rect x="72" y="94" width="86" height="76" fill="#FFFFFF" stroke="#0F1115" stroke-width="4"/>
  <path d="M60 98L115 50L170 98Z" fill="#D5D8DD" stroke="#0F1115" stroke-width="4"/>
  <circle cx="115" cy="80" r="7" fill="#FFFFFF" stroke="#0F1115" stroke-width="3"/>
  <!-- the windows -->
  <rect x="80" y="108" width="18" height="18" fill="#D5D8DD" stroke="#0F1115" stroke-width="3"/>
  <path d="M89 108v18M80 117h18" fill="none" stroke="#0F1115" stroke-width="2"/>
  <rect x="132" y="108" width="18" height="18" fill="#D5D8DD" stroke="#0F1115" stroke-width="3"/>
  <path d="M141 108v18M132 117h18" fill="none" stroke="#0F1115" stroke-width="2"/>
  <!-- the door, shut -->
  <path d="M103 170v-32a12 12 0 0 1 24 0v32Z" fill="#C6F432" stroke="#0F1115" stroke-width="3"/>
  <circle cx="121" cy="154" r="2" fill="#0F1115"/>
  <!-- the step and the path to the door -->
  <path d="M98 170h34" fill="none" stroke="#0F1115" stroke-width="3"/>
  <!-- ivy climbing the left corner -->
  <path d="M72 168c4-12-4-22 2-34c4-8-2-16 2-26" fill="none" stroke="#0F1115" stroke-width="2"/>
  <ellipse cx="68" cy="156" rx="5" ry="3.5" fill="#C6F432" stroke="#0F1115" stroke-width="2" transform="rotate(-30 68 156)"/>
  <ellipse cx="79" cy="146" rx="5" ry="3.5" fill="#C6F432" stroke="#0F1115" stroke-width="2" transform="rotate(30 79 146)"/>
  <ellipse cx="69" cy="134" rx="5" ry="3.5" fill="#C6F432" stroke="#0F1115" stroke-width="2" transform="rotate(-30 69 134)"/>
  <ellipse cx="80" cy="122" rx="5" ry="3.5" fill="#C6F432" stroke="#0F1115" stroke-width="2" transform="rotate(30 80 122)"/>
  <ellipse cx="70" cy="110" rx="5" ry="3.5" fill="#C6F432" stroke="#0F1115" stroke-width="2" transform="rotate(-30 70 110)"/>
  <!-- the speech bubble -->
  <path d="M26 24h40a10 10 0 0 1 10 10v12a10 10 0 0 1-10 10h-24l-10 10v-10h-6a10 10 0 0 1-10-10v-12a10 10 0 0 1 10-10z" fill="#0F1115"/>
  <circle cx="36" cy="40" r="3.2" fill="#FFFFFF"/>
  <circle cx="46" cy="40" r="3.2" fill="#FFFFFF"/>
  <circle cx="56" cy="40" r="3.2" fill="#FFFFFF"/>
</svg>
